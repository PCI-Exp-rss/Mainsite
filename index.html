        <script> async function fetchDiscordStatus() {
    try {
      const res = await fetch("https://api.lanyard.rest/v1/users/1209579752290131968");
      const { data } = await res.json();
      if (!data) return;

      const colors = { online: '#23a559', idle: '#f0b232', dnd: '#f23f43', offline: '#80848e' };
      const statusColor = colors[data.discord_status] || colors.offline;

      const ext = data.discord_user.avatar.startsWith('a_') ? 'gif' : 'png';
      document.getElementById('dc-pfp').src = `https://cdn.discordapp.com/avatars/${data.discord_user.id}/${data.discord_user.avatar}.${ext}?size=128`;
      document.getElementById('dc-dot').style.backgroundColor = statusColor;
      document.getElementById('dc-username').textContent = data.discord_user.global_name || data.discord_user.username;

      const customStatus = data.activities.find(a => a.type === 4);
      let statusText = "No custom status";
      if (customStatus) {
        statusText = customStatus.state || "";
        if (customStatus.emoji) {
          const emojiStr = customStatus.emoji.id ? `:${customStatus.emoji.name}:` : customStatus.emoji.name;
          statusText = `${emojiStr} ${statusText}`.trim();
        }
      }
      document.getElementById('dc-status-text').textContent = statusText;

      const devIcons = {
        desktop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
        mobile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>',
        web: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>'
      };

      let activeDevices = [];
      if (data.active_on_discord_desktop) activeDevices.push(devIcons.desktop);
      if (data.active_on_discord_mobile) activeDevices.push(devIcons.mobile);
      if (data.active_on_discord_web) activeDevices.push(devIcons.web);

      const devContainer = document.getElementById('dc-devices');
      devContainer.style.color = statusColor;

      if (activeDevices.length > 0) {
        devContainer.style.display = 'flex';
        let html = `<div class="dev-wrapper">${activeDevices[0]}`;
        if (activeDevices.length > 1) {
          html += `<div class="dev-badge">+${activeDevices.length - 1}</div>`;
          let hoverHtml = `<div class="dev-tooltip">`;
          for(let i = 1; i < activeDevices.length; i++) hoverHtml += activeDevices[i];
          hoverHtml += `</div>`;
          html += hoverHtml;
        }
        html += `</div>`;
        devContainer.innerHTML = html;
      } else {
        devContainer.style.display = 'none';
        devContainer.innerHTML = '';
      }

      const rp = data.activities.find(a => a.type !== 4);
      const actContainer = document.getElementById('dc-activity');
      if (rp) {
        let imgHtml = '';
        if (rp.assets && rp.assets.large_image) {
          let imgUrl = rp.assets.large_image.startsWith('mp:external') 
            ? `https://media.discordapp.net/external/${rp.assets.large_image.replace('mp:external/','')}` 
            : `https://cdn.discordapp.com/app-assets/${rp.application_id}/${rp.assets.large_image}.png`;
          imgHtml = `<img src="${imgUrl}" alt="Activity Icon">`;
        } else {
          imgHtml = `<div style="width:48px; height:48px; border-radius:8px; background:currentColor; opacity:0.1; flex-shrink:0;"></div>`;
        }

        actContainer.innerHTML = `
          ${imgHtml}
          <div class="dc-activity-info">
            <div class="dc-activity-name">${rp.name}</div>
            ${rp.details ? `<div class="dc-activity-details">${rp.details}</div>` : ''}
            ${rp.state ? `<div class="dc-activity-details">${rp.state}</div>` : ''}
          </div>
        `;
        actContainer.style.display = 'flex';
      } else {
        actContainer.style.display = 'none';
        actContainer.innerHTML = '';
      }

      document.getElementById('discord-widget').style.display = 'flex';

    } catch(e) {
      console.error("Failed to fetch Lanyard data:", e);
    }
  }

  fetchDiscordStatus();
  setInterval(fetchDiscordStatus, 100);</script>
